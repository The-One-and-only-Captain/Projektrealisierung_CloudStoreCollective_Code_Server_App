name: code-server
display_name: "Code-Server (VS Code im Browser)"
description: "Self-hosted VS Code im Browser. Pro Studierendem eine isolierte IDE-Instanz mit eigenem Workspace und Passwortschutz."
version: "2.0.0"
category: "education"
author: "DHBW CloudStore Team"
icon: code-server.png

terraform:
  working_dir: terraform/
  required_version: ">= 1.6.0"

tags:
  - code-server
  - vscode
  - ide
  - education

email_credentials:
  enabled: true

deploy-strategy:
  one-instance: true
  one-per-group: true

ui-groups:
  - id: general
    title: "Allgemein und Nutzer"
    order: 1
  - id: resources
    title: "Ressourcen"
    order: 2

parameters:

  general:
    - name: app_name
      type: string
      required: true
      validation:
        pattern: "^[a-z0-9-]{3,20}$"
      description: "Name der Code-Server-Instanz"
      x-ui:
        group_id: general
        in_group_order: 1
        icon: Server
        placeholder: "z.B. wwi23sea-codeserver"
        hint: "Nur Kleinbuchstaben, Zahlen und Bindestriche (3-20 Zeichen)"

    - name: admin_username
      type: string
      required: true
      description: "Dozent (erhält eigene Code-Server-Instanz und Sudo-Rechte auf der VM)"
      x-ui:
        group_id: general
        in_group_order: 2
        icon: Users
        placeholder: "Dozent auswählen..."
        widget:
          type: user-picker
          multi: false
          extract: email

    - name: students
      type: array
      required: false
      validation:
        max_items: 19
      description: "Studierende (jeder erhält eigene Code-Server-Instanz auf der VM)"
      x-ui:
        group_id: general
        in_group_order: 3
        icon: Users
        placeholder: "Studierende auswählen..."
        hint: "Alle teilnehmenden Studierenden auswählen. Bei Strategie 'one-instance' teilen sich alle eine VM (eigener Port pro Person, max. 19 + Dozent). Bei 'one-per-group' wird daraus unten die Gruppen-Auswahl."
        widget:
          type: user-picker
          multi: true
          extract: email

    - name: student_groups
      type: groups
      required: false
      description: "Projektgruppen der Studierenden (nur bei one-per-group)"
      x-ui:
        group_id: general
        in_group_order: 4
        icon: Users
        hint: "Optional: Studierende aus der Auswahl oben in Gruppen einteilen. Bei Strategie 'one-per-group' entsteht pro Gruppe eine eigene VM. Bei 'one-instance' ignoriert."
        widget:
          type: group-builder
          extract: email

  specific:
    - name: flavor_name
      type: selection
      required: true
      default: "gp1.medium"
      options:
        - label: "Small (1 CPU, 2 GB RAM) — bis ~5 Nutzer"
          value: "gp1.small"
        - label: "Medium (2 CPU, 4 GB RAM) — bis ~10 Nutzer"
          value: "gp1.medium"
        - label: "Large (4 CPU, 8 GB RAM) — bis ~20 Nutzer"
          value: "gp1.large"
      description: "VM-Größe"
      x-ui:
        group_id: resources
        in_group_order: 1
        icon: Cpu
        hint: "Pro Nutzer eine eigene Code-Server-Instanz — Größe nach Anzahl wählen."

outputs:
  - name: instance_id
    description: "System ID der Instanz"
    display: false

  - name: app_name
    description: "Name der Anwendung"
    display: true

  - name: admin_url
    description: "Code-Server URL (Dozent)"
    display: true

  - name: student_port_range
    description: "Port-Range der Studierenden-Instanzen"
    display: true

  - name: ssh_command
    description: "SSH-Zugang zur VM"
    display: true

  - name: admin_credentials
    description: "Admin-Zugangsdaten (Dozent)"
    sensitive: true
    display: false

  - name: student_credentials
    description: "Studierenden-Zugangsdaten"
    sensitive: true
    display: false

  - name: ssh_private_key
    description: "SSH Private Key"
    sensitive: true
    display: false
